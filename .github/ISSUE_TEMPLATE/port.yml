name: 다른 차종 또는 펌웨어 지원
description: 한국 내수용 현대·기아·제네시스 Gen5W 지원 요청
title: "[Port] "
body:
  - type: markdown
    attributes:
      value: USB의 GEN5W-REPORT/ISSUE.md 로그를 확인하고 첨부해 주세요. 한국 내수용 Gen5W만 대상입니다. 원시 로그·제조사 파일·개인정보는 올리지 마세요.
  - type: dropdown
    id: brand
    attributes:
      label: 제조사
      options:
        - 현대
        - 기아
        - 제네시스
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 차량 연식/모델, 지역과 헤드유닛 세대
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: 정확한 펌웨어 버전
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 진단 로그
      description: ISSUE.md를 끌어다 놓거나 내용을 붙여 넣어 주세요. 첨부 전 내용을 확인해 주세요.
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: 확인할 버전
      description: 공식 배포판은 기본형(내장 Wi-Fi)과 동글형(USB Wi-Fi)입니다. 내장 Wi-Fi가 없는 차는 동글형을 선택하세요.
      options:
        - 기본형 (내장 Wi-Fi)
        - 동글형 (USB Wi-Fi)
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: 릴리스 버전 또는 BUILD-REVISION
      description: 아직 설치하지 않았다면 미설치라고 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: dongle
    attributes:
      label: USB Wi-Fi 동글 정보 (해당할 때)
      description: 제품명·칩셋·USB VID/PID를 아는 범위에서 적어 주세요. MAC 주소·일련번호는 제외합니다.
  - type: textarea
    id: scope
    attributes:
      label: 필요한 기능과 현재 확인 결과
      description: 무선 연결·유선 연결·HUD·안내 생략을 성공/실패/미사용/미확인으로 나눠 적어 주세요. Wi-Fi 하드웨어 등 비식별 정보만 포함합니다.
    validations:
      required: true
